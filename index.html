<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 学习卡片生成器</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <nav id="demo-toolbar" class="demo-toolbar hidden" aria-label="UI 阶段预览">
        <span>UI 预览</span>
        <button type="button" data-demo="input">输入页</button>
        <button type="button" data-demo="loading">生成中</button>
        <button type="button" data-demo="ready">生成成功</button>
        <button type="button" data-demo="error">生成失败</button>
        <button type="button" data-demo="front">自测正面</button>
        <button type="button" data-demo="back">自测背面</button>
        <button type="button" data-demo="answered">已答回看</button>
        <button type="button" data-demo="summary">复习总结</button>
        <button type="button" data-demo="complete">全部掌握</button>
      </nav>

      <section id="input-view" class="view active" aria-labelledby="app-title">
        <header class="hero">
          <p class="eyebrow">扫码即用的复习工具</p>
          <h1 id="app-title">AI 学习卡片生成器</h1>
          <p>把课文、知识点、笔记或错题变成可以自测的复习卡片。</p>
        </header>

        <form id="material-form" class="panel">
          <div class="field-grid">
            <label>
              <span>科目</span>
              <select id="subject" name="subject">
                <option>语文</option>
                <option>数学</option>
                <option>英语</option>
                <option>科学</option>
                <option>生物</option>
                <option>物理</option>
                <option>历史</option>
                <option>道法</option>
              </select>
            </label>

            <label>
              <span>年级</span>
              <select id="grade" name="grade">
                <option>小学高年级</option>
                <option selected>初中</option>
              </select>
            </label>
          </div>

          <div class="input-modes" aria-label="输入方式">
            <button class="mode active" type="button" aria-pressed="true">文本输入</button>
            <button class="mode upcoming" type="button" data-upcoming="拍照输入">拍照输入</button>
            <button class="mode upcoming" type="button" data-upcoming="语音输入">语音输入</button>
          </div>

          <label class="material-label" for="material">
            <span>学习材料</span>
            <textarea id="material" name="material" rows="9" placeholder="粘贴课文、知识点、笔记或错题内容..."></textarea>
          </label>

          <p id="form-message" class="message" role="status"></p>
          <button class="primary-action" type="submit">生成复习卡片</button>
        </form>
      </section>

      <section id="loading-view" class="view" aria-labelledby="loading-title">
        <div class="panel centered">
          <h2 id="loading-title">正在生成复习卡片...</h2>
          <div class="loader" aria-hidden="true"></div>
          <p>系统正在把你的学习材料整理成自测问题，请稍等。</p>
          <button id="cancel-generation" class="secondary-action" type="button">返回修改</button>
        </div>
      </section>

      <section id="ready-view" class="view" aria-labelledby="ready-title">
        <div class="panel">
          <h2 id="ready-title">已生成复习卡片</h2>
          <p id="ready-meta" class="subtle"></p>
          <div id="preview-card" class="preview-card"></div>
          <div class="action-row">
            <button id="start-study" class="primary-action" type="button">开始自测</button>
            <button id="edit-material" class="secondary-action" type="button">返回修改</button>
          </div>
        </div>
      </section>

      <section id="error-view" class="view" aria-labelledby="error-title">
        <div class="panel centered">
          <h2 id="error-title">生成失败</h2>
          <p class="subtle">可能原因：内容太长、网络异常或暂时无法生成。</p>
          <div class="action-row">
            <button id="error-edit" class="secondary-action" type="button">返回修改</button>
            <button id="error-retry" class="primary-action" type="button">再试一次</button>
          </div>
        </div>
      </section>

      <section id="study-view" class="view" aria-labelledby="study-title">
        <header class="study-header">
          <h2 id="study-title">卡片自测</h2>
          <p id="progress-text"></p>
        </header>

        <article id="study-card" class="study-card"></article>

        <div id="answer-actions" class="answer-actions hidden">
          <button id="mark-known" class="primary-action" type="button">我会了</button>
          <button id="mark-review" class="warning-action" type="button">再复习</button>
        </div>

        <div class="nav-row">
          <button id="prev-card" class="secondary-action" type="button">上一张</button>
          <button id="next-card" class="secondary-action" type="button">下一张</button>
        </div>

        <button id="show-summary" class="primary-action full hidden" type="button">查看总结</button>
      </section>

      <section id="summary-view" class="view" aria-labelledby="summary-title">
        <div class="panel">
          <h2 id="summary-title">本次复习总结</h2>
          <div id="summary-stats" class="stats-grid"></div>
          <div id="review-list" class="review-list"></div>
          <div class="action-row">
            <button id="review-only" class="primary-action" type="button">只复习这些</button>
            <button id="restart" class="secondary-action" type="button">返回首页</button>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
